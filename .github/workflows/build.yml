name: build

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TelegramGeminiBot.slnx

      - name: Build
        run: dotnet build TelegramGeminiBot.slnx --no-restore -c Release

      - name: Test
        run: dotnet test TelegramGeminiBot.slnx --no-build -c Release

      - name: Check for vulnerable packages
        run: |
          dotnet list TelegramGeminiBot/TelegramGeminiBot.csproj package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt
