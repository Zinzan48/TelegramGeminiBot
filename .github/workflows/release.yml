name: release

# Push a tag such as v0.2.0 to build every package and publish a GitHub Release.
# Run it manually (workflow_dispatch) to build the packages as workflow artifacts without releasing.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test TelegramGeminiBot.slnx -c Release

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [ win-x64, linux-x64, linux-arm64 ]
        flavor: [ self-contained, framework-dependent ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Work out version and package name
        id: meta
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then version="${GITHUB_REF_NAME#v}"; else version="0.0.0-dev"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package=TelegramGeminiBot-$version-${{ matrix.rid }}-${{ matrix.flavor }}" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: >
          dotnet publish TelegramGeminiBot/TelegramGeminiBot.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained ${{ matrix.flavor == 'self-contained' }}
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:Version=${{ steps.meta.outputs.version }}
          -o "staging/${{ steps.meta.outputs.package }}"

      - name: Add docs
        run: cp README.md README.zh-TW.md CHANGELOG.md LICENSE "staging/${{ steps.meta.outputs.package }}/"

      # The doctor exits 1 here (no token, no Gemini CLI); the point is that the binary starts,
      # reads appsettings.json from its own folder and prints release-style commands.
      - name: Smoke test (linux-x64)
        if: matrix.rid == 'linux-x64'
        working-directory: /tmp
        run: |
          set +e
          "$GITHUB_WORKSPACE/staging/${{ steps.meta.outputs.package }}/TelegramGeminiBot" doctor < /dev/null > doctor.txt 2>&1
          code=$?
          set -e
          cat doctor.txt
          test "$code" -eq 1
          grep -q "Telegram bot token: Not configured" doctor.txt
          grep -q "BotProfiles__0__Token" doctor.txt

      - name: Zip
        run: |
          mkdir -p dist
          cd staging
          zip -r -q "../dist/${{ steps.meta.outputs.package }}.zip" "${{ steps.meta.outputs.package }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.package }}
          path: dist/${{ steps.meta.outputs.package }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: TelegramGeminiBot-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/attest@v4
        with:
          subject-path: dist/*.zip

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # Release notes: this version's section of CHANGELOG.md.
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          # In-page links such as (#upgrading-from-010) would break on the release page.
          sed -i "s|](#|](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md#|g" notes.md
          cat >> notes.md <<EOF

          ## Downloads

          Pick the zip for your platform. \`self-contained\` includes .NET; \`framework-dependent\` is smaller but needs the [.NET 10 Runtime](https://dotnet.microsoft.com/download/dotnet/10.0).

          Verify a download with \`gh attestation verify <zip> --repo ${GITHUB_REPOSITORY}\` or against \`SHA256SUMS.txt\`.
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag --repo "$GITHUB_REPOSITORY"
          fi
